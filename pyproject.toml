[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "opsmind-ai"
version = "0.2.0"
description = "Production-style AI operations copilot with RAG, MCP, GraphQL, agent orchestration and evals"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.5",
  "openai>=1.50",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "pgvector>=0.3",
  "strawberry-graphql[fastapi]>=0.246",
  "mcp>=1.0,<2.0",
  "httpx>=0.27",
  "redis>=5.1",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["evals*", "tests*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
